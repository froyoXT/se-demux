[project]
name = "se-demux"
version = "0.6.0"
description = "A neural engine that learns where a model should look, and grows its own topology from verified results"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
neural-engine = "neural_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neural_engine"]

[tool.hatch.build.targets.wheel.force-include]
"pack" = "pack"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode arrows and dots in prose are intended

[tool.mypy]
python_version = "3.11"
packages = ["neural_engine"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
